<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<!-- La página de la web (M47): la plantilla de Godot 4.7.2 con una pantalla de carga del juego (el logo, una barra
		con el tanto por ciento que ha llegado y frases del conserje en el idioma del navegador). Godot la usa al exportar a
		web (export_presets.cfg, html/custom_html_shell). Ver docs/WEB.md -->
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #d9d1bd;
	background-color: #0d0a0f;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background-color: #0d0a0f;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 28px;
	padding: 0 16px;
	visibility: hidden;
	font-family: 'Courier New', Consolas, monospace;
	text-align: center;
}

/* El logo es pixel art de 201×62: se amplía sin suavizar, ×3 si cabe */
#logo {
	width: min(603px, 90vw);
	image-rendering: pixelated;
}

#barra {
	width: min(420px, 80vw);
	height: 18px;
	box-sizing: border-box;
	border: 3px solid #2b2732;
	background-color: #0f0d17;
	box-shadow: 0 0 0 3px #0f0d17;
}

#barra-lleno {
	height: 100%;
	width: 0;
	background-color: #ff5d73;
	transition: width 0.2s linear;
}

#barra.esperando #barra-lleno {
	width: 30%;
	animation: esperando 1.2s ease-in-out infinite alternate;
}

@keyframes esperando {
	from { margin-left: 0; }
	to { margin-left: 70%; }
}

#megas {
	font-size: 15px;
	color: #9b93a0;
	min-height: 1.2em;
	margin-top: -16px;
}

#frase {
	font-size: 17px;
	min-height: 1.3em;
	max-width: 520px;
	transition: opacity 0.4s;
}

#status-notice {
	display: none;
	background-color: #5b3943;
	border: 3px solid #9b3943;
	color: #e0e0e0;
	line-height: 1.3;
	max-width: 520px;
	padding: 1rem;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

// Lo que se lee mientras carga, en los idiomas del juego (el del navegador; si no es ninguno de estos, en inglés).
// No pasa por Idioma.t (el juego aún no ha arrancado): si se cambia una frase, se cambia aquí en todos
const TEXTOS = {
	es: {
		frases: ['Buscando las llaves del cuarto de calderas…', 'Fregando la sangre del pasillo…',
			'Contando las balas que quedan…', 'Cambiando las bombillas fundidas…', 'Engrasando la fregona…'],
	},
	en: {
		frases: ['Looking for the boiler room keys…', 'Mopping the blood off the hallway…',
			'Counting the bullets left…', 'Changing the burnt-out bulbs…', 'Oiling the mop…'],
	},
	pt: {
		frases: ['Procurando as chaves da sala das caldeiras…', 'Limpando o sangue do corredor…',
			'Contando as balas que sobraram…', 'Trocando as lâmpadas queimadas…', 'Lubrificando o esfregão…'],
	},
	de: {
		frases: ['Suche die Schlüssel zum Heizungskeller…', 'Wische das Blut im Flur auf…',
			'Zähle die restlichen Kugeln…', 'Wechsle die durchgebrannten Glühbirnen…', 'Öle den Wischmopp…'],
	},
	fr: {
		frases: ['Je cherche les clés de la chaufferie…', 'Je nettoie le sang du couloir…',
			'Je compte les balles qui restent…', 'Je change les ampoules grillées…', 'Je graisse la serpillière…'],
	},
	ru: {
		frases: ['Ищу ключи от котельной…', 'Отмываю кровь в коридоре…',
			'Считаю оставшиеся патроны…', 'Меняю перегоревшие лампочки…', 'Смазываю швабру…'],
	},
	zh: {
		frases: ['正在找锅炉房的钥匙……', '正在拖走廊上的血……', '正在数剩下的子弹……', '正在换烧坏的灯泡……', '正在给拖把上油……'],
	},
};

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const barra = document.getElementById('barra');
	const barraLleno = document.getElementById('barra-lleno');
	const megas = document.getElementById('megas');
	const frase = document.getElementById('frase');

	const lengua = (navigator.languages || [navigator.language || 'en']).map((l) => l.slice(0, 2).toLowerCase())
		.find((l) => l in TEXTOS) || 'en';
	const textos = TEXTOS[lengua];
	document.documentElement.lang = lengua;

	// Las frases van cambiando cada 3 s, empezando por una cualquiera
	let fraseI = Math.floor(Math.random() * textos.frases.length);
	frase.textContent = textos.frases[fraseI];
	const relevo = setInterval(() => {
		frase.style.opacity = 0;
		setTimeout(() => {
			fraseI = (fraseI + 1) % textos.frases.length;
			frase.textContent = textos.frases[fraseI];
			frase.style.opacity = 1;
		}, 400);
	}, 3000);

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			clearInterval(relevo);
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		const cargando = mode === 'progress';
		barra.style.display = cargando ? 'block' : 'none';
		megas.style.display = cargando ? 'block' : 'none';
		frase.style.display = cargando ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		clearInterval(relevo);
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					// la barra se llena con lo que ha llegado; debajo, el tanto por ciento (en megas engañaría: Godot cuenta
					// los archivos sin comprimir, el doble de lo que se descarga de verdad)
					barra.classList.remove('esperando');
					barraLleno.style.width = Math.min(100, current / total * 100) + '%';
					megas.textContent = Math.floor(current / total * 100) + ' %';
				} else {
					barra.classList.add('esperando');
					barraLleno.style.width = '';
					megas.textContent = '';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
